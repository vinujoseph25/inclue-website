<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400">
  <!-- Background -->
  <rect width="600" height="400" fill="#F8F9FA" rx="15" ry="15"/>
  
  <!-- Circuit board background pattern -->
  <g opacity="0.07">
    <path d="M0,50 L600,50" stroke="#0460E9" stroke-width="1"/>
    <path d="M0,100 L600,100" stroke="#0460E9" stroke-width="1"/>
    <path d="M0,150 L600,150" stroke="#0460E9" stroke-width="1"/>
    <path d="M0,200 L600,200" stroke="#0460E9" stroke-width="1"/>
    <path d="M0,250 L600,250" stroke="#0460E9" stroke-width="1"/>
    <path d="M0,300 L600,300" stroke="#0460E9" stroke-width="1"/>
    <path d="M0,350 L600,350" stroke="#0460E9" stroke-width="1"/>
    
    <path d="M50,0 L50,400" stroke="#0460E9" stroke-width="1"/>
    <path d="M100,0 L100,400" stroke="#0460E9" stroke-width="1"/>
    <path d="M150,0 L150,400" stroke="#0460E9" stroke-width="1"/>
    <path d="M200,0 L200,400" stroke="#0460E9" stroke-width="1"/>
    <path d="M250,0 L250,400" stroke="#0460E9" stroke-width="1"/>
    <path d="M300,0 L300,400" stroke="#0460E9" stroke-width="1"/>
    <path d="M350,0 L350,400" stroke="#0460E9" stroke-width="1"/>
    <path d="M400,0 L400,400" stroke="#0460E9" stroke-width="1"/>
    <path d="M450,0 L450,400" stroke="#0460E9" stroke-width="1"/>
    <path d="M500,0 L500,400" stroke="#0460E9" stroke-width="1"/>
    <path d="M550,0 L550,400" stroke="#0460E9" stroke-width="1"/>
  </g>
  
  <!-- Main PLC Controller -->
  <g transform="translate(300, 200)">
    <!-- PLC Case -->
    <rect x="-125" y="-85" width="250" height="170" rx="5" ry="5" fill="#001B2E"/>
    
    <!-- PLC Inner Panel -->
    <rect x="-115" y="-75" width="230" height="150" rx="3" ry="3" fill="#0460E9"/>
    
    <!-- PLC Digital Inputs/Outputs Section -->
    <g transform="translate(-90, -50)">
      <rect x="0" y="0" width="70" height="60" fill="#58CBF9"/>
      
      <!-- IO Terminal Blocks -->
      <g>
        <rect x="5" y="5" width="10" height="10" fill="#001B2E"/>
        <rect x="20" y="5" width="10" height="10" fill="#001B2E"/>
        <rect x="35" y="5" width="10" height="10" fill="#001B2E"/>
        <rect x="50" y="5" width="10" height="10" fill="#001B2E"/>
        
        <rect x="5" y="20" width="10" height="10" fill="#001B2E"/>
        <rect x="20" y="20" width="10" height="10" fill="#001B2E"/>
        <rect x="35" y="20" width="10" height="10" fill="#001B2E"/>
        <rect x="50" y="20" width="10" height="10" fill="#001B2E"/>
        
        <rect x="5" y="35" width="10" height="10" fill="#001B2E"/>
        <rect x="20" y="35" width="10" height="10" fill="#001B2E"/>
        <rect x="35" y="35" width="10" height="10" fill="#001B2E"/>
        <rect x="50" y="35" width="10" height="10" fill="#001B2E"/>
      </g>
      
      <!-- LED Indicators -->
      <circle cx="10" cy="10" r="2" fill="#CCF1FF">
        <animate attributeName="fill-opacity" values="0.5;1;0.5" dur="1s" repeatCount="indefinite"/>
      </circle>
      <circle cx="25" cy="10" r="2" fill="#CCF1FF">
        <animate attributeName="fill-opacity" values="0.5;1;0.5" dur="1.2s" repeatCount="indefinite"/>
      </circle>
      <circle cx="40" cy="10" r="2" fill="#CCF1FF">
        <animate attributeName="fill-opacity" values="0.5;1;0.5" dur="0.8s" repeatCount="indefinite"/>
      </circle>
      <circle cx="55" cy="10" r="2" fill="#CCF1FF">
        <animate attributeName="fill-opacity" values="0.5;1;0.5" dur="1.5s" repeatCount="indefinite"/>
      </circle>
    </g>
    
    <!-- PLC Analog Inputs Section -->
    <g transform="translate(0, -50)">
      <rect x="0" y="0" width="70" height="60" fill="#0099FF"/>
      
      <!-- Analog Terminal Blocks -->
      <g>
        <rect x="5" y="5" width="60" height="7" fill="#001B2E"/>
        <rect x="5" y="17" width="60" height="7" fill="#001B2E"/>
        <rect x="5" y="29" width="60" height="7" fill="#001B2E"/>
        <rect x="5" y="41" width="60" height="7" fill="#001B2E"/>
      </g>
      
      <!-- Signal Level Indicators -->
      <rect x="10" y="7" width="40" height="3" fill="#CCF1FF">
        <animate attributeName="width" values="10;40;10" dur="4s" repeatCount="indefinite"/>
      </rect>
      <rect x="10" y="19" width="30" height="3" fill="#CCF1FF">
        <animate attributeName="width" values="20;30;20" dur="3s" repeatCount="indefinite"/>
      </rect>
      <rect x="10" y="31" width="50" height="3" fill="#CCF1FF">
        <animate attributeName="width" values="30;50;30" dur="5s" repeatCount="indefinite"/>
      </rect>
      <rect x="10" y="43" width="20" height="3" fill="#CCF1FF">
        <animate attributeName="width" values="10;20;10" dur="2s" repeatCount="indefinite"/>
      </rect>
    </g>
    
    <!-- PLC CPU/Processing Section -->
    <g transform="translate(-90, 20)">
      <rect x="0" y="0" width="70" height="40" fill="#0460E9"/>
      
      <!-- CPU -->
      <rect x="10" y="5" width="50" height="30" fill="#001B2E"/>
      <rect x="15" y="10" width="40" height="20" fill="#58CBF9"/>
      
      <!-- Activity Lights -->
      <circle cx="20" cy="15" r="3" fill="#CCF1FF">
        <animate attributeName="fill-opacity" values="0.5;1;0.5" dur="0.5s" repeatCount="indefinite"/>
      </circle>
      <circle cx="30" cy="15" r="3" fill="#CCF1FF">
        <animate attributeName="fill-opacity" values="0.5;1;0.5" dur="0.7s" repeatCount="indefinite"/>
      </circle>
      <circle cx="40" cy="15" r="3" fill="#CCF1FF">
        <animate attributeName="fill-opacity" values="0.5;1;0.5" dur="0.3s" repeatCount="indefinite"/>
      </circle>
      <circle cx="50" cy="15" r="3" fill="#CCF1FF">
        <animate attributeName="fill-opacity" values="0.5;1;0.5" dur="0.9s" repeatCount="indefinite"/>
      </circle>
      
      <!-- Processor Grid -->
      <path d="M15,20 L55,20 M15,25 L55,25 M20,20 L20,30 M30,20 L30,30 M40,20 L40,30 M50,20 L50,30" stroke="#001B2E" stroke-width="0.5"/>
    </g>
    
    <!-- PLC Communication Section -->
    <g transform="translate(0, 20)">
      <rect x="0" y="0" width="70" height="40" fill="#58CBF9"/>
      
      <!-- Ethernet Ports -->
      <rect x="10" y="5" width="20" height="15" fill="#001B2E"/>
      <rect x="40" y="5" width="20" height="15" fill="#001B2E"/>
      
      <!-- Data Transfer Visualization -->
      <g>
        <circle cx="20" cy="12" r="2" fill="#CCF1FF">
          <animate attributeName="cx" values="12;28;12" dur="1s" repeatCount="indefinite"/>
        </circle>
        <circle cx="50" cy="12" r="2" fill="#CCF1FF">
          <animate attributeName="cx" values="42;58;42" dur="1s" repeatCount="indefinite"/>
        </circle>
      </g>
      
      <!-- Status LEDs -->
      <rect x="10" y="25" width="50" height="10" fill="#001B2E"/>
      <circle cx="17" cy="30" r="3" fill="#0099FF">
        <animate attributeName="fill-opacity" values="0.5;1;0.5" dur="0.8s" repeatCount="indefinite"/>
      </circle>
      <circle cx="27" cy="30" r="3" fill="#CCF1FF">
        <animate attributeName="fill-opacity" values="0.5;1;0.5" dur="1.2s" repeatCount="indefinite"/>
      </circle>
      <circle cx="37" cy="30" r="3" fill="#0099FF">
        <animate attributeName="fill-opacity" values="0.5;1;0.5" dur="1.5s" repeatCount="indefinite"/>
      </circle>
      <circle cx="47" cy="30" r="3" fill="#CCF1FF">
        <animate attributeName="fill-opacity" values="0.5;1;0.5" dur="1s" repeatCount="indefinite"/>
      </circle>
    </g>
  </g>
  
  <!-- Connection Lines -->
  <g stroke="#0460E9" stroke-width="2" fill="none">
    <!-- Input connections -->
    <path d="M120,140 L175,150">
      <animate attributeName="stroke-opacity" values="0.2;1;0.2" dur="2s" repeatCount="indefinite"/>
    </path>
    <path d="M120,170 L175,170">
      <animate attributeName="stroke-opacity" values="0.2;1;0.2" dur="2s" repeatCount="indefinite" begin="0.5s"/>
    </path>
    <path d="M120,200 L175,190">
      <animate attributeName="stroke-opacity" values="0.2;1;0.2" dur="2s" repeatCount="indefinite" begin="1s"/>
    </path>
    
    <!-- Output connections -->
    <path d="M425,150 L480,140">
      <animate attributeName="stroke-opacity" values="0.2;1;0.2" dur="2s" repeatCount="indefinite" begin="0.3s"/>
    </path>
    <path d="M425,170 L480,170">
      <animate attributeName="stroke-opacity" values="0.2;1;0.2" dur="2s" repeatCount="indefinite" begin="0.8s"/>
    </path>
    <path d="M425,190 L480,200">
      <animate attributeName="stroke-opacity" values="0.2;1;0.2" dur="2s" repeatCount="indefinite" begin="1.3s"/>
    </path>
  </g>
  
  <!-- Input Devices -->
  <g transform="translate(90, 140)">
    <!-- Proximity Sensor -->
    <rect x="0" y="-10" width="30" height="20" rx="3" ry="3" fill="#001B2E"/>
    <circle cx="15" cy="0" r="5" fill="#0099FF">
      <animate attributeName="fill-opacity" values="0.5;1;0.5" dur="1.5s" repeatCount="indefinite"/>
    </circle>
  </g>
  
  <g transform="translate(90, 170)">
    <!-- Push Button -->
    <circle cx="15" cy="0" r="15" fill="#0460E9"/>
    <circle cx="15" cy="0" r="10" fill="#58CBF9"/>
    <circle cx="15" cy="0" r="7" fill="#CCF1FF"/>
  </g>
  
  <g transform="translate(90, 200)">
    <!-- Limit Switch -->
    <rect x="0" y="-7" width="30" height="14" fill="#001B2E"/>
    <path d="M5,0 L25,0" stroke="#0099FF" stroke-width="2"/>
    <circle cx="15" cy="0" r="3" fill="#CCF1FF">
      <animate attributeName="cx" values="10;20;10" dur="3s" repeatCount="indefinite"/>
    </circle>
  </g>
  
  <!-- Output Devices -->
  <g transform="translate(480, 140)">
    <!-- Motor -->
    <circle cx="20" cy="0" r="20" fill="#0460E9"/>
    <circle cx="20" cy="0" r="15" fill="#001B2E"/>
    <circle cx="20" cy="0" r="5" fill="#58CBF9">
      <animateTransform attributeName="transform" type="rotate" from="0 20 0" to="360 20 0" dur="2s" repeatCount="indefinite"/>
    </circle>
    <path d="M20,0 L20,-15 M20,0 L13,-9 M20,0 L27,-9" stroke="#58CBF9" stroke-width="2">
      <animateTransform attributeName="transform" type="rotate" from="0 20 0" to="360 20 0" dur="2s" repeatCount="indefinite"/>
    </path>
  </g>
  
  <g transform="translate(480, 170)">
    <!-- Solenoid Valve -->
    <rect x="0" y="-15" width="40" height="30" rx="2" ry="2" fill="#001B2E"/>
    <rect x="15" y="-10" width="10" height="20" fill="#0099FF">
      <animate attributeName="x" values="5;25;5" dur="3s" repeatCount="indefinite"/>
    </rect>
    <circle cx="10" cy="0" r="3" fill="#58CBF9"/>
    <circle cx="30" cy="0" r="3" fill="#58CBF9"/>
  </g>
  
  <g transform="translate(480, 200)">
    <!-- Indicator Light -->
    <rect x="5" y="-20" width="30" height="40" rx="3" ry="3" fill="#001B2E"/>
    <circle cx="20" cy="-5" r="8" fill="#0460E9">
      <animate attributeName="fill-opacity" values="0.3;1;0.3" dur="1s" repeatCount="indefinite"/>
    </circle>
    <circle cx="20" cy="10" r="8" fill="#0099FF">
      <animate attributeName="fill-opacity" values="0.3;1;0.3" dur="1.5s" repeatCount="indefinite" begin="0.5s"/>
    </circle>
  </g>
  
  <!-- Process Flow Data -->
  <g fill="#0099FF">
    <circle cx="135" cy="150" r="3">
      <animate attributeName="cx" values="135;175" dur="2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;0" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="135" cy="170" r="3">
      <animate attributeName="cx" values="135;175" dur="2s" begin="0.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;0" dur="2s" begin="0.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="135" cy="190" r="3">
      <animate attributeName="cx" values="135;175" dur="2s" begin="1s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;0" dur="2s" begin="1s" repeatCount="indefinite"/>
    </circle>
    
    <circle cx="425" cy="150" r="3">
      <animate attributeName="cx" values="425;480" dur="2s" begin="0.3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;0" dur="2s" begin="0.3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="425" cy="170" r="3">
      <animate attributeName="cx" values="425;480" dur="2s" begin="0.8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;0" dur="2s" begin="0.8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="425" cy="190" r="3">
      <animate attributeName="cx" values="425;480" dur="2s" begin="1.3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;0" dur="2s" begin="1.3s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>