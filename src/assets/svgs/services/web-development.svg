<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <!-- Background with subtle gradient -->
  <rect width="800" height="600" fill="url(#bgGradient)" rx="20" ry="20"/>
  
  <!-- Definitions -->
  <defs>
    <!-- Background gradient -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFF" />
      <stop offset="100%" stop-color="#EDF1F9" />
    </linearGradient>
    
    <!-- Screen gradient -->
    <linearGradient id="screenGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F5F7FA" />
    </linearGradient>
    
    <!-- Button gradient -->
    <linearGradient id="buttonGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0470F5" />
      <stop offset="100%" stop-color="#0460E9" />
    </linearGradient>
    
    <!-- Laptop screen reflection -->
    <linearGradient id="screenReflection" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="white" stop-opacity="0.1" />
      <stop offset="20%" stop-color="white" stop-opacity="0.05" />
      <stop offset="100%" stop-color="white" stop-opacity="0" />
    </linearGradient>
    
    <!-- Shadow for devices -->
    <filter id="deviceShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="5" />
      <feOffset dx="0" dy="5" result="offsetblur" />
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.2" />
      </feComponentTransfer>
      <feMerge>
        <feMergeNode />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    
    <!-- Soft glow -->
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="5" />
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.2" />
      </feComponentTransfer>
      <feMerge>
        <feMergeNode />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  
  <!-- Main workspace elements -->
  <g transform="translate(400, 300)" filter="url(#deviceShadow)">
    <!-- Laptop -->
    <g>
      <!-- Laptop base -->
      <path d="M-200,120 C-190,133 190,133 200,120 L220,150 C200,170 -200,170 -220,150 Z" fill="#3A3E46"/>
      <path d="M-180,125 C-170,135 170,135 180,125 L200,154 C180,165 -180,165 -200,154 Z" fill="#2A2D33"/>
      
      <!-- Laptop screen frame -->
      <path d="M-200,-150 L200,-150 C210,-150 220,-140 220,-130 L220,120 L-220,120 L-220,-130 C-220,-140 -210,-150 -200,-150 Z" fill="#3A3E46"/>
      
      <!-- Laptop screen -->
      <rect x="-190" y="-140" width="380" height="250" rx="5" ry="5" fill="url(#screenGradient)"/>
      
      <!-- Screen content -->
      <g clip-path="url(#screenClip)">
        <!-- Website layout on screen -->
        <g transform="translate(-190, -140) scale(0.95)">
          <!-- Navigation bar -->
          <rect x="0" y="0" width="400" height="40" fill="#0460E9"/>
          <rect x="10" y="12" width="80" height="15" rx="3" ry="3" fill="#58CBF9"/>
          
          <!-- Menu items -->
          <rect x="220" y="12" width="25" height="15" rx="3" ry="3" fill="#0099FF" opacity="0.6"/>
          <rect x="255" y="12" width="25" height="15" rx="3" ry="3" fill="#0099FF" opacity="0.6"/>
          <rect x="290" y="12" width="25" height="15" rx="3" ry="3" fill="#0099FF" opacity="0.6"/>
          <rect x="325" y="12" width="25" height="15" rx="3" ry="3" fill="#0099FF" opacity="0.6"/>
          <rect x="360" y="12" width="25" height="15" rx="3" ry="3" fill="#0099FF" opacity="0.6"/>
          
          <!-- Hero section -->
          <rect x="0" y="40" width="400" height="150" fill="#0099FF"/>
          <rect x="40" y="70" width="160" height="20" rx="3" ry="3" fill="white" opacity="0.8"/>
          <rect x="40" y="100" width="130" height="10" rx="2" ry="2" fill="white" opacity="0.6"/>
          <rect x="40" y="120" width="130" height="10" rx="2" ry="2" fill="white" opacity="0.6"/>
          <rect x="40" y="150" width="80" height="25" rx="12.5" ry="12.5" fill="url(#buttonGradient)"/>
          
          <!-- Hero image -->
          <rect x="230" y="60" width="130" height="110" rx="5" ry="5" fill="#58CBF9" opacity="0.8"/>
          
          <!-- Content section -->
          <rect x="0" y="190" width="400" height="100" fill="white"/>
          <rect x="40" y="210" width="100" height="15" rx="3" ry="3" fill="#001B2E" opacity="0.7"/>
          <rect x="40" y="235" width="320" height="8" rx="2" ry="2" fill="#001B2E" opacity="0.2"/>
          <rect x="40" y="250" width="320" height="8" rx="2" ry="2" fill="#001B2E" opacity="0.2"/>
          <rect x="40" y="265" width="240" height="8" rx="2" ry="2" fill="#001B2E" opacity="0.2"/>
          
          <!-- Feature boxes -->
          <g>
            <!-- Box 1 -->
            <rect x="40" y="290" width="95" height="100" rx="5" ry="5" fill="#F5F7FA"/>
            <rect x="60" y="310" width="55" height="8" rx="4" ry="4" fill="#001B2E" opacity="0.6"/>
            <rect x="60" y="328" width="55" height="6" rx="3" ry="3" fill="#001B2E" opacity="0.2"/>
            <rect x="60" y="340" width="55" height="6" rx="3" ry="3" fill="#001B2E" opacity="0.2"/>
            <rect x="60" y="352" width="55" height="6" rx="3" ry="3" fill="#001B2E" opacity="0.2"/>
            <rect x="60" y="370" width="35" height="10" rx="5" ry="5" fill="#0460E9" opacity="0.7"/>
            
            <!-- Box 2 -->
            <rect x="150" y="290" width="95" height="100" rx="5" ry="5" fill="#F5F7FA"/>
            <rect x="170" y="310" width="55" height="8" rx="4" ry="4" fill="#001B2E" opacity="0.6"/>
            <rect x="170" y="328" width="55" height="6" rx="3" ry="3" fill="#001B2E" opacity="0.2"/>
            <rect x="170" y="340" width="55" height="6" rx="3" ry="3" fill="#001B2E" opacity="0.2"/>
            <rect x="170" y="352" width="55" height="6" rx="3" ry="3" fill="#001B2E" opacity="0.2"/>
            <rect x="170" y="370" width="35" height="10" rx="5" ry="5" fill="#0460E9" opacity="0.7"/>
            
            <!-- Box 3 -->
            <rect x="260" y="290" width="95" height="100" rx="5" ry="5" fill="#F5F7FA"/>
            <rect x="280" y="310" width="55" height="8" rx="4" ry="4" fill="#001B2E" opacity="0.6"/>
            <rect x="280" y="328" width="55" height="6" rx="3" ry="3" fill="#001B2E" opacity="0.2"/>
            <rect x="280" y="340" width="55" height="6" rx="3" ry="3" fill="#001B2E" opacity="0.2"/>
            <rect x="280" y="352" width="55" height="6" rx="3" ry="3" fill="#001B2E" opacity="0.2"/>
            <rect x="280" y="370" width="35" height="10" rx="5" ry="5" fill="#0460E9" opacity="0.7"/>
          </g>
        </g>
        
        <!-- Screen reflection -->
        <rect x="-190" y="-140" width="380" height="250" fill="url(#screenReflection)"/>
      </g>
      
      <!-- Screen clip path -->
      <clipPath id="screenClip">
        <rect x="-190" y="-140" width="380" height="250" rx="5" ry="5"/>
      </clipPath>
      
      <!-- Laptop details -->
      <circle cx="0" cy="135" r="5" fill="#2A2D33"/>
    </g>
  </g>
  
  <!-- Tablet device -->
  <g transform="translate(170, 350) rotate(-5)" filter="url(#deviceShadow)">
    <rect x="-70" y="-100" width="140" height="200" rx="12" ry="12" fill="#3A3E46"/>
    <rect x="-65" y="-95" width="130" height="190" rx="8" ry="8" fill="url(#screenGradient)"/>
    
    <!-- Tablet content -->
    <g clip-path="url(#tabletScreenClip)">
      <!-- Responsive tablet layout -->
      <g transform="translate(-65, -95) scale(0.45)">
        <!-- Navigation bar -->
        <rect x="0" y="0" width="290" height="35" fill="#0460E9"/>
        <rect x="10" y="10" width="60" height="15" rx="3" ry="3" fill="#58CBF9"/>
        
        <!-- Menu icon -->
        <rect x="240" y="10" width="20" height="3" rx="1.5" ry="1.5" fill="white"/>
        <rect x="240" y="16" width="20" height="3" rx="1.5" ry="1.5" fill="white"/>
        <rect x="240" y="22" width="20" height="3" rx="1.5" ry="1.5" fill="white"/>
        
        <!-- Hero section -->
        <rect x="0" y="35" width="290" height="120" fill="#0099FF"/>
        <rect x="20" y="55" width="130" height="20" rx="3" ry="3" fill="white" opacity="0.8"/>
        <rect x="20" y="85" width="100" height="10" rx="2" ry="2" fill="white" opacity="0.6"/>
        <rect x="20" y="105" width="100" height="10" rx="2" ry="2" fill="white" opacity="0.6"/>
        <rect x="20" y="130" width="70" height="20" rx="10" ry="10" fill="url(#buttonGradient)"/>
        
        <!-- Hero image -->
        <rect x="160" y="50" width="110" height="90" rx="5" ry="5" fill="#58CBF9" opacity="0.8"/>
        
        <!-- Content section -->
        <rect x="0" y="155" width="290" height="80" fill="white"/>
        <rect x="20" y="170" width="80" height="12" rx="3" ry="3" fill="#001B2E" opacity="0.7"/>
        <rect x="20" y="190" width="250" height="7" rx="2" ry="2" fill="#001B2E" opacity="0.2"/>
        <rect x="20" y="205" width="250" height="7" rx="2" ry="2" fill="#001B2E" opacity="0.2"/>
        <rect x="20" y="220" width="180" height="7" rx="2" ry="2" fill="#001B2E" opacity="0.2"/>
        
        <!-- Feature grid -->
        <rect x="10" y="245" width="130" height="80" rx="5" ry="5" fill="#F5F7FA"/>
        <rect x="20" y="260" width="110" height="8" rx="4" ry="4" fill="#001B2E" opacity="0.6"/>
        <rect x="20" y="275" width="110" height="5" rx="2.5" ry="2.5" fill="#001B2E" opacity="0.2"/>
        <rect x="20" y="285" width="110" height="5" rx="2.5" ry="2.5" fill="#001B2E" opacity="0.2"/>
        <rect x="20" y="295" width="110" height="5" rx="2.5" ry="2.5" fill="#001B2E" opacity="0.2"/>
        <rect x="20" y="310" width="40" height="10" rx="5" ry="5" fill="#0460E9" opacity="0.7"/>
        
        <rect x="150" y="245" width="130" height="80" rx="5" ry="5" fill="#F5F7FA"/>
        <rect x="160" y="260" width="110" height="8" rx="4" ry="4" fill="#001B2E" opacity="0.6"/>
        <rect x="160" y="275" width="110" height="5" rx="2.5" ry="2.5" fill="#001B2E" opacity="0.2"/>
        <rect x="160" y="285" width="110" height="5" rx="2.5" ry="2.5" fill="#001B2E" opacity="0.2"/>
        <rect x="160" y="295" width="110" height="5" rx="2.5" ry="2.5" fill="#001B2E" opacity="0.2"/>
        <rect x="160" y="310" width="40" height="10" rx="5" ry="5" fill="#0460E9" opacity="0.7"/>
        
        <rect x="10" y="335" width="270" height="80" rx="5" ry="5" fill="#F5F7FA"/>
        <rect x="20" y="350" width="110" height="8" rx="4" ry="4" fill="#001B2E" opacity="0.6"/>
        <rect x="20" y="365" width="250" height="5" rx="2.5" ry="2.5" fill="#001B2E" opacity="0.2"/>
        <rect x="20" y="375" width="250" height="5" rx="2.5" ry="2.5" fill="#001B2E" opacity="0.2"/>
        <rect x="20" y="385" width="200" height="5" rx="2.5" ry="2.5" fill="#001B2E" opacity="0.2"/>
        <rect x="20" y="400" width="40" height="10" rx="5" ry="5" fill="#0460E9" opacity="0.7"/>
      </g>
      
      <!-- Tablet screen reflection -->
      <rect x="-65" y="-95" width="130" height="190" rx="8" ry="8" fill="url(#screenReflection)"/>
    </g>
    
    <clipPath id="tabletScreenClip">
      <rect x="-65" y="-95" width="130" height="190" rx="8" ry="8"/>
    </clipPath>
    
    <!-- Home button -->
    <circle cx="0" cy="107" r="7" fill="#2A2D33"/>
  </g>
  
  <!-- Mobile device -->
  <g transform="translate(620, 330) rotate(8)" filter="url(#deviceShadow)">
    <rect x="-35" y="-70" width="70" height="140" rx="10" ry="10" fill="#3A3E46"/>
    <rect x="-30" y="-65" width="60" height="130" rx="6" ry="6" fill="url(#screenGradient)"/>
    
    <!-- Mobile content -->
    <g clip-path="url(#mobileScreenClip)">
      <!-- Mobile layout -->
      <g transform="translate(-30, -65) scale(0.21)">
        <!-- Mobile navigation -->
        <rect x="0" y="0" width="290" height="45" fill="#0460E9"/>
        <rect x="10" y="10" width="70" height="25" rx="4" ry="4" fill="#58CBF9"/>
        
        <!-- Mobile menu -->
        <rect x="240" y="15" width="25" height="4" rx="2" ry="2" fill="white"/>
        <rect x="240" y="23" width="25" height="4" rx="2" ry="2" fill="white"/>
        <rect x="240" y="31" width="25" height="4" rx="2" ry="2" fill="white"/>
        
        <!-- Mobile hero -->
        <rect x="0" y="45" width="290" height="180" fill="#0099FF"/>
        <rect x="20" y="75" width="250" height="25" rx="4" ry="4" fill="white" opacity="0.8"/>
        <rect x="20" y="110" width="200" height="12" rx="2" ry="2" fill="white" opacity="0.6"/>
        <rect x="20" y="130" width="200" height="12" rx="2" ry="2" fill="white" opacity="0.6"/>
        <rect x="20" y="160" width="100" height="30" rx="15" ry="15" fill="url(#buttonGradient)"/>
        
        <!-- Mobile content -->
        <rect x="0" y="225" width="290" height="120" fill="white"/>
        <rect x="20" y="245" width="250" height="15" rx="3" ry="3" fill="#001B2E" opacity="0.7"/>
        <rect x="20" y="270" width="250" height="10" rx="2" ry="2" fill="#001B2E" opacity="0.2"/>
        <rect x="20" y="290" width="250" height="10" rx="2" ry="2" fill="#001B2E" opacity="0.2"/>
        <rect x="20" y="310" width="150" height="10" rx="2" ry="2" fill="#001B2E" opacity="0.2"/>
        <rect x="20" y="330" width="250" height="10" rx="2" ry="2" fill="#001B2E" opacity="0.2"/>
        
        <!-- Mobile cards -->
        <rect x="10" y="355" width="270" height="100" rx="8" ry="8" fill="#F5F7FA"/>
        <rect x="20" y="370" width="250" height="12" rx="3" ry="3" fill="#001B2E" opacity="0.6"/>
        <rect x="20" y="390" width="250" height="8" rx="2" ry="2" fill="#001B2E" opacity="0.2"/>
        <rect x="20" y="405" width="250" height="8" rx="2" ry="2" fill="#001B2E" opacity="0.2"/>
        <rect x="20" y="420" width="250" height="8" rx="2" ry="2" fill="#001B2E" opacity="0.2"/>
        <rect x="20" y="435" width="80" height="15" rx="7.5" ry="7.5" fill="#0460E9" opacity="0.7"/>
        
        <rect x="10" y="465" width="270" height="100" rx="8" ry="8" fill="#F5F7FA"/>
        <rect x="20" y="480" width="250" height="12" rx="3" ry="3" fill="#001B2E" opacity="0.6"/>
        <rect x="20" y="500" width="250" height="8" rx="2" ry="2" fill="#001B2E" opacity="0.2"/>
        <rect x="20" y="515" width="250" height="8" rx="2" ry="2" fill="#001B2E" opacity="0.2"/>
        <rect x="20" y="530" width="250" height="8" rx="2" ry="2" fill="#001B2E" opacity="0.2"/>
        <rect x="20" y="545" width="80" height="15" rx="7.5" ry="7.5" fill="#0460E9" opacity="0.7"/>
      </g>
      
      <!-- Mobile screen reflection -->
      <rect x="-30" y="-65" width="60" height="130" rx="6" ry="6" fill="url(#screenReflection)"/>
    </g>
    
    <clipPath id="mobileScreenClip">
      <rect x="-30" y="-65" width="60" height="130" rx="6" ry="6"/>
    </clipPath>
    
    <!-- Home button -->
    <circle cx="0" cy="75" r="5" fill="#2A2D33"/>
  </g>
  
  <!-- Code editor window -->
  <g transform="translate(630, 190) rotate(3)" filter="url(#deviceShadow)">
    <!-- Code editor window -->
    <rect x="-100" y="-80" width="200" height="160" rx="10" ry="10" fill="#252A33"/>
    <rect x="-95" y="-55" width="190" height="130" rx="5" ry="5" fill="#1E222A"/>
    
    <!-- Window title bar -->
    <rect x="-100" y="-80" width="200" height="20" rx="10" ry="10" fill="#3A3E46"/>
    <circle cx="-85" cy="-70" r="5" fill="#FF5F57"/>
    <circle cx="-70" cy="-70" r="5" fill="#FFBD2E"/>
    <circle cx="-55" cy="-70" r="5" fill="#28CA41"/>
    
    <!-- Code lines -->
    <g>
      <rect x="-85" y="-45" width="40" height="5" rx="2" ry="2" fill="#7E88A0" opacity="0.7"/>
      <rect x="-85" y="-35" width="100" height="5" rx="2" ry="2" fill="#7E88A0" opacity="0.5"/>
      <rect x="-85" y="-25" width="160" height="5" rx="2" ry="2" fill="#76ABFF" opacity="0.8"/>
      <rect x="-85" y="-15" width="120" height="5" rx="2" ry="2" fill="#76ABFF" opacity="0.7"/>
      <rect x="-85" y="-5" width="140" height="5" rx="2" ry="2" fill="#FF9668" opacity="0.8"/>
      <rect x="-85" y="5" width="90" height="5" rx="2" ry="2" fill="#FF9668" opacity="0.7"/>
      <rect x="-85" y="15" width="60" height="5" rx="2" ry="2" fill="#7E88A0" opacity="0.6"/>
      <rect x="-85" y="25" width="130" height="5" rx="2" ry="2" fill="#76ABFF" opacity="0.8"/>
      <rect x="-85" y="35" width="150" height="5" rx="2" ry="2" fill="#88FFC7" opacity="0.8"/>
      <rect x="-85" y="45" width="70" height="5" rx="2" ry="2" fill="#FF9668" opacity="0.7"/>
    </g>
  </g>
  
  <!-- UI Design artboard -->
  <g transform="translate(170, 190) rotate(-3)" filter="url(#deviceShadow)">
    <!-- Design tool window -->
    <rect x="-100" y="-80" width="200" height="160" rx="10" ry="10" fill="#FFFFFF"/>
    <rect x="-95" y="-55" width="190" height="130" rx="5" ry="5" fill="#F8FAFF"/>
    
    <!-- Window title bar -->
    <rect x="-100" y="-80" width="200" height="20" rx="10" ry="10" fill="#EEEEEE"/>
    <circle cx="-85" cy="-70" r="5" fill="#FF5F57"/>
    <circle cx="-70" cy="-70" r="5" fill="#FFBD2E"/>
    <circle cx="-55" cy="-70" r="5" fill="#28CA41"/>
    
    <!-- Design elements -->
    <g clip-path="url(#designClip)">
      <!-- Rulers -->
      <rect x="-95" y="-55" width="5" height="130" fill="#EEEEEE"/>
      <rect x="-95" y="-55" width="190" height="5" fill="#EEEEEE"/>
      
      <!-- Artboard -->
      <rect x="-80" y="-40" width="160" height="100" rx="5" ry="5" fill="white" stroke="#DDDDDD" stroke-width="1"/>
      
      <!-- UI Elements -->
      <rect x="-70" y="-30" width="140" height="20" rx="3" ry="3" fill="#0460E9"/>
      <rect x="-65" y="-25" width="40" height="10" rx="2" ry="2" fill="#58CBF9"/>
      
      <rect x="-70" y="0" width="140" height="40" rx="3" ry="3" fill="#0099FF"/>
      <rect x="-60" y="10" width="60" height="8" rx="2" ry="2" fill="white" opacity="0.8"/>
      <rect x="-60" y="22" width="40" height="5" rx="1" ry="1" fill="white" opacity="0.6"/>
      
      <rect x="-70" y="50" width="65" height="30" rx="3" ry="3" fill="#F5F7FA"/>
      <rect x="-65" y="55" width="55" height="5" rx="1" ry="1" fill="#001B2E" opacity="0.6"/>
      <rect x="-65" y="65" width="45" height="3" rx="1" ry="1" fill="#001B2E" opacity="0.2"/>
      <rect x="-65" y="72" width="35" height="3" rx="1" ry="1" fill="#001B2E" opacity="0.2"/>
      
      <rect x="5" y="50" width="65" height="30" rx="3" ry="3" fill="#F5F7FA"/>
      <rect x="10" y="55" width="55" height="5" rx="1" ry="1" fill="#001B2E" opacity="0.6"/>
      <rect x="10" y="65" width="45" height="3" rx="1" ry="1" fill="#001B2E" opacity="0.2"/>
      <rect x="10" y="72" width="35" height="3" rx="1" ry="1" fill="#001B2E" opacity="0.2"/>
    </g>
    
    <clipPath id="designClip">
      <rect x="-95" y="-55" width="190" height="130" rx="5" ry="5"/>
    </clipPath>
    
    <!-- Tools panel -->
    <rect x="-120" y="-55" width="15" height="130" fill="#EEEEEE"/>
    <circle cx="-112" cy="-30" r="4" fill="#0460E9"/>
    <circle cx="-112" cy="-15" r="4" fill="#AAAAAA"/>
    <circle cx="-112" cy="0" r="4" fill="#AAAAAA"/>
    <circle cx="-112" cy="15" r="4" fill="#AAAAAA"/>
    <circle cx="-112" cy="30" r="4" fill="#AAAAAA"/>
    <circle cx="-112" cy="45" r="4" fill="#AAAAAA"/>
  </g>
  
</svg>