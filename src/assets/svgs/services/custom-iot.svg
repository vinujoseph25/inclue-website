<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400">
  <!-- Background -->
  <rect width="600" height="400" fill="#F8F9FA" rx="15" ry="15"/>
  
  <!-- Circuit board pattern -->
  <g opacity="0.08">
    <path d="M0,100 L600,100" stroke="#0460E9" stroke-width="1" stroke-dasharray="5,5"/>
    <path d="M0,200 L600,200" stroke="#0460E9" stroke-width="1" stroke-dasharray="5,5"/>
    <path d="M0,300 L600,300" stroke="#0460E9" stroke-width="1" stroke-dasharray="5,5"/>
    
    <path d="M100,0 L100,400" stroke="#0460E9" stroke-width="1" stroke-dasharray="5,5"/>
    <path d="M200,0 L200,400" stroke="#0460E9" stroke-width="1" stroke-dasharray="5,5"/>
    <path d="M300,0 L300,400" stroke="#0460E9" stroke-width="1" stroke-dasharray="5,5"/>
    <path d="M400,0 L400,400" stroke="#0460E9" stroke-width="1" stroke-dasharray="5,5"/>
    <path d="M500,0 L500,400" stroke="#0460E9" stroke-width="1" stroke-dasharray="5,5"/>
  </g>
  
  <!-- Central cloud platform -->
  <g transform="translate(300, 185)">
    <!-- Cloud shape -->
    <path d="M-70,-25 Q-80,-50 -50,-50 Q-40,-80 -10,-80 Q20,-80 30,-50 Q60,-60 70,-30 Q90,-30 90,0 Q90,30 70,30 Q60,60 30,50 Q20,80 -10,80 Q-40,80 -50,50 Q-80,50 -70,25 Q-90,20 -90,-10 Q-90,-30 -70,-25" 
          fill="#0099FF" opacity="0.9"/>
    
    <!-- Data center icon in cloud -->
    <g transform="translate(0, 0)">
      <rect x="-30" y="-25" width="60" height="50" rx="5" ry="5" fill="#001B2E"/>
      <rect x="-25" y="-20" width="50" height="10" rx="1" ry="1" fill="#58CBF9"/>
      <rect x="-25" y="-5" width="50" height="10" rx="1" ry="1" fill="#58CBF9"/>
      <rect x="-25" y="10" width="50" height="10" rx="1" ry="1" fill="#58CBF9"/>
      
      <circle cx="-20" cy="-15" r="2" fill="#CCF1FF"/>
      <circle cx="-20" cy="0" r="2" fill="#CCF1FF"/>
      <circle cx="-20" cy="15" r="2" fill="#CCF1FF"/>
    </g>
  </g>
  
  <!-- IoT Devices -->
  <!-- Smart Home -->
  <g transform="translate(120, 280)">
    <!-- House -->
    <polygon points="0,0 50,0 50,40 0,40" fill="#0460E9"/>
    <polygon points="0,0 25,-20 50,0" fill="#0099FF"/>
    
    <!-- Door -->
    <rect x="20" y="20" width="10" height="20" fill="#CCF1FF"/>
    
    <!-- Window -->
    <rect x="10" y="10" width="10" height="10" fill="#CCF1FF"/>
    <rect x="30" y="10" width="10" height="10" fill="#CCF1FF"/>
    
    <!-- Smart home signal -->
    <path d="M25,-30 Q25,-40 35,-40 L40,-40" stroke="#58CBF9" stroke-width="2" fill="none">
      <animate attributeName="stroke-opacity" values="0.2;1;0.2" dur="2s" repeatCount="indefinite"/>
    </path>
    <path d="M25,-30 Q25,-50 45,-50 L55,-50" stroke="#58CBF9" stroke-width="2" fill="none">
      <animate attributeName="stroke-opacity" values="0.2;1;0.2" dur="2s" repeatCount="indefinite" begin="0.3s"/>
    </path>
    <path d="M25,-30 Q25,-60 55,-60 L70,-60" stroke="#58CBF9" stroke-width="2" fill="none">
      <animate attributeName="stroke-opacity" values="0.2;1;0.2" dur="2s" repeatCount="indefinite" begin="0.6s"/>
    </path>
  </g>
  
  <!-- Industrial Sensor -->
  <g transform="translate(480, 280)">
    <!-- Sensor Base -->
    <rect x="-20" y="0" width="40" height="15" fill="#001B2E" rx="3" ry="3"/>
    
    <!-- Sensor Body -->
    <rect x="-15" y="-25" width="30" height="25" fill="#0460E9" rx="2" ry="2"/>
    
    <!-- Sensor LED -->
    <circle cx="0" cy="-15" r="5" fill="#58CBF9">
      <animate attributeName="fill-opacity" values="0.5;1;0.5" dur="1s" repeatCount="indefinite"/>
    </circle>
    
    <!-- Sensor Data Signals -->
    <path d="M0,-30 Q0,-40 -10,-40 L-20,-40" stroke="#0099FF" stroke-width="2" fill="none">
      <animate attributeName="stroke-opacity" values="0.2;1;0.2" dur="1.5s" repeatCount="indefinite"/>
    </path>
    <path d="M0,-30 Q0,-50 -20,-50 L-35,-50" stroke="#0099FF" stroke-width="2" fill="none">
      <animate attributeName="stroke-opacity" values="0.2;1;0.2" dur="1.5s" repeatCount="indefinite" begin="0.3s"/>
    </path>
    <path d="M0,-30 Q0,-60 -30,-60 L-50,-60" stroke="#0099FF" stroke-width="2" fill="none">
      <animate attributeName="stroke-opacity" values="0.2;1;0.2" dur="1.5s" repeatCount="indefinite" begin="0.6s"/>
    </path>
  </g>
  
  <!-- Wearable Device -->
  <g transform="translate(120, 120)">
    <!-- Smartwatch -->
    <rect x="-15" y="-20" width="30" height="40" rx="5" ry="5" fill="#001B2E"/>
    <rect x="-12" y="-17" width="24" height="34" rx="3" ry="3" fill="#CCF1FF"/>
    
    <!-- Watchband -->
    <path d="M-15,-15 L-25,-15 L-25,15 L-15,15" fill="#0460E9"/>
    <path d="M15,-15 L25,-15 L25,15 L15,15" fill="#0460E9"/>
    
    <!-- Health data on screen -->
    <path d="M-5,-5 L-2,0 L2,-10 L5,-5" stroke="#0099FF" stroke-width="1" fill="none"/>
    <path d="M-5,5 L-2,10 L2,0 L5,5" stroke="#0099FF" stroke-width="1" fill="none"/>
    
    <!-- Signal from watch -->
    <path d="M0,-25 Q0,-35 10,-35 L20,-35" stroke="#58CBF9" stroke-width="2" fill="none">
      <animate attributeName="stroke-opacity" values="0.2;1;0.2" dur="2s" repeatCount="indefinite"/>
    </path>
    <path d="M0,-25 Q0,-45 20,-45 L35,-45" stroke="#58CBF9" stroke-width="2" fill="none">
      <animate attributeName="stroke-opacity" values="0.2;1;0.2" dur="2s" repeatCount="indefinite" begin="0.4s"/>
    </path>
    <path d="M0,-25 Q0,-55 30,-55 L50,-55" stroke="#58CBF9" stroke-width="2" fill="none">
      <animate attributeName="stroke-opacity" values="0.2;1;0.2" dur="2s" repeatCount="indefinite" begin="0.8s"/>
    </path>
  </g>
  
  <!-- Connected Vehicle -->
  <g transform="translate(480, 120)">
    <!-- Car body -->
    <rect x="-30" y="-15" width="60" height="25" rx="7" ry="7" fill="#0460E9"/>
    <rect x="-25" y="-25" width="50" height="15" rx="3" ry="3" fill="#0099FF"/>
    
    <!-- Wheels -->
    <circle cx="-20" cy="15" r="8" fill="#001B2E"/>
    <circle cx="-20" cy="15" r="4" fill="#58CBF9"/>
    <circle cx="20" cy="15" r="8" fill="#001B2E"/>
    <circle cx="20" cy="15" r="4" fill="#58CBF9"/>
    
    <!-- Headlights -->
    <rect x="-28" y="-5" width="5" height="5" fill="#CCF1FF"/>
    <rect x="23" y="-5" width="5" height="5" fill="#CCF1FF"/>
    
    <!-- Signal from car -->
    <path d="M0,-30 Q0,-40 -10,-40 L-20,-40" stroke="#0099FF" stroke-width="2" fill="none">
      <animate attributeName="stroke-opacity" values="0.2;1;0.2" dur="1.7s" repeatCount="indefinite"/>
    </path>
    <path d="M0,-30 Q0,-50 -20,-50 L-35,-50" stroke="#0099FF" stroke-width="2" fill="none">
      <animate attributeName="stroke-opacity" values="0.2;1;0.2" dur="1.7s" repeatCount="indefinite" begin="0.5s"/>
    </path>
    <path d="M0,-30 Q0,-60 -30,-60 L-50,-60" stroke="#0099FF" stroke-width="2" fill="none">
      <animate attributeName="stroke-opacity" values="0.2;1;0.2" dur="1.7s" repeatCount="indefinite" begin="1s"/>
    </path>
  </g>
  
  <!-- Connection Lines to Cloud -->
  <path d="M135,250 C150,200 200,190 230,185" stroke="#0460E9" stroke-width="2" stroke-dasharray="5,5" fill="none">
    <animate attributeName="stroke-opacity" values="0.2;1;0.2" dur="3s" repeatCount="indefinite" />
  </path>
  
  <path d="M465,250 C450,200 400,190 370,185" stroke="#0460E9" stroke-width="2" stroke-dasharray="5,5" fill="none">
    <animate attributeName="stroke-opacity" values="0.2;1;0.2" dur="3s" repeatCount="indefinite" begin="0.7s"/>
  </path>
  
  <path d="M135,120 C150,150 200,160 230,185" stroke="#0460E9" stroke-width="2" stroke-dasharray="5,5" fill="none">
    <animate attributeName="stroke-opacity" values="0.2;1;0.2" dur="3s" repeatCount="indefinite" begin="1.4s"/>
  </path>
  
  <path d="M465,120 C450,150 400,160 370,185" stroke="#0460E9" stroke-width="2" stroke-dasharray="5,5" fill="none">
    <animate attributeName="stroke-opacity" values="0.2;1;0.2" dur="3s" repeatCount="indefinite" begin="2.1s"/>
  </path>
  
  <!-- Data Packets -->
  <g>
    <circle cx="160" cy="220" r="4" fill="#0099FF">
      <animate attributeName="cx" values="160;230" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="220;185" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;0" dur="3s" repeatCount="indefinite"/>
    </circle>
    
    <circle cx="440" cy="220" r="4" fill="#0099FF">
      <animate attributeName="cx" values="440;370" dur="3s" begin="0.7s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="220;185" dur="3s" begin="0.7s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;0" dur="3s" begin="0.7s" repeatCount="indefinite"/>
    </circle>
    
    <circle cx="160" cy="150" r="4" fill="#0099FF">
      <animate attributeName="cx" values="160;230" dur="3s" begin="1.4s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="150;185" dur="3s" begin="1.4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;0" dur="3s" begin="1.4s" repeatCount="indefinite"/>
    </circle>
    
    <circle cx="440" cy="150" r="4" fill="#0099FF">
      <animate attributeName="cx" values="440;370" dur="3s" begin="2.1s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="150;185" dur="3s" begin="2.1s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;0" dur="3s" begin="2.1s" repeatCount="indefinite"/>
    </circle>
  </g>
  
</svg>