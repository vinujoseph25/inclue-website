<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <!-- Definitions for gradients, patterns and filters -->
  <defs>
    <!-- Gradients -->
    <linearGradient id="bg-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#CCF1FF" />
      <stop offset="100%" stop-color="#58CBF9" />
    </linearGradient>
    
    <linearGradient id="blue-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0460E9" />
      <stop offset="100%" stop-color="#0099FF" />
    </linearGradient>
    
    <linearGradient id="dark-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#001B2E" />
      <stop offset="100%" stop-color="#0460E9" />
    </linearGradient>
    
    <!-- Drop shadow for elements -->
    <filter id="drop-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3" />
      <feOffset dx="2" dy="2" result="offsetblur" />
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.3" />
      </feComponentTransfer>
      <feMerge>
        <feMergeNode />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    
    <!-- Glass effect -->
    <filter id="glass-effect" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    
    <!-- Arrow marker for lines -->
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#0460E9" />
    </marker>
  </defs>
  
  <!-- Subtle grid background -->
  <rect width="800" height="600" fill="#f8fcff" />
  <path d="M0,0 L800,0 L800,600 L0,600 L0,0" fill="url(#bg-gradient)" opacity="0.2" />
  
  <!-- Grid pattern -->
  <g stroke="#e0e0e0" stroke-width="0.5">
    <g id="vertical-lines">
      <line x1="100" y1="0" x2="100" y2="600" />
      <line x1="200" y1="0" x2="200" y2="600" />
      <line x1="300" y1="0" x2="300" y2="600" />
      <line x1="400" y1="0" x2="400" y2="600" />
      <line x1="500" y1="0" x2="500" y2="600" />
      <line x1="600" y1="0" x2="600" y2="600" />
      <line x1="700" y1="0" x2="700" y2="600" />
    </g>
    <g id="horizontal-lines">
      <line x1="0" y1="100" x2="800" y2="100" />
      <line x1="0" y1="200" x2="800" y2="200" />
      <line x1="0" y1="300" x2="800" y2="300" />
      <line x1="0" y1="400" x2="800" y2="400" />
      <line x1="0" y1="500" x2="800" y2="500" />
    </g>
  </g>
  
  <!-- Main central hub - Inclue Platform -->
  <g filter="url(#drop-shadow)">
    <circle cx="400" cy="300" r="90" fill="url(#blue-gradient)" opacity="0.9" />
    <circle cx="400" cy="300" r="80" fill="#ffffff" opacity="0.7" />
    <circle cx="400" cy="300" r="70" fill="url(#blue-gradient)" opacity="0.6" />
    <circle cx="400" cy="300" r="60" fill="#ffffff" opacity="0.5" />
    
    <!-- Digital core visualization -->
    <g transform="translate(400, 300)">
      <!-- Circuit board pattern -->
      <path d="M-40,-40 L40,-40 L40,40 L-40,40 Z" fill="none" stroke="#0460E9" stroke-width="1" opacity="0.6" />
      <path d="M-30,-30 L30,-30 L30,30 L-30,30 Z" fill="none" stroke="#0460E9" stroke-width="1" opacity="0.6" />
      <path d="M-20,-40 L-20,40 M0,-40 L0,40 M20,-40 L20,40 M-40,-20 L40,-20 M-40,0 L40,0 M-40,20 L40,20" 
            stroke="#0460E9" stroke-width="1" opacity="0.6" />
      
      <!-- Data points -->
      <circle cx="-20" cy="-20" r="3" fill="#0099FF" />
      <circle cx="0" cy="-20" r="3" fill="#0099FF" />
      <circle cx="20" cy="-20" r="3" fill="#0099FF" />
      <circle cx="-20" cy="0" r="3" fill="#0099FF" />
      <circle cx="0" cy="0" r="5" fill="#0099FF" />
      <circle cx="20" cy="0" r="3" fill="#0099FF" />
      <circle cx="-20" cy="20" r="3" fill="#0099FF" />
      <circle cx="0" cy="20" r="3" fill="#0099FF" />
      <circle cx="20" cy="20" r="3" fill="#0099FF" />
    </g>
  </g>
  
  <!-- Manufacturing Solutions Node -->
  <g transform="translate(180, 180)" filter="url(#drop-shadow)">
    <circle cx="0" cy="0" r="60" fill="#FFFFFF" stroke="#0460E9" stroke-width="2" />
    
    <!-- Factory/Manufacturing Visualization -->
    <g transform="scale(0.8)">
      <!-- Factory building outline -->
      <rect x="-40" y="-20" width="80" height="50" fill="#E8F4FF" stroke="#0460E9" stroke-width="2" />
      <path d="M-40,-20 L-25,-40 L25,-40 L40,-20" fill="#E8F4FF" stroke="#0460E9" stroke-width="2" /> <!-- Roof -->
      
      <!-- Factory elements -->
      <rect x="-30" y="10" width="15" height="20" fill="#FFFFFF" stroke="#0460E9" stroke-width="1.5" /> <!-- Door -->
      <rect x="-10" y="-10" width="10" height="10" fill="#FFFFFF" stroke="#0460E9" stroke-width="1.5" /> <!-- Window -->
      <rect x="10" y="-10" width="10" height="10" fill="#FFFFFF" stroke="#0460E9" stroke-width="1.5" /> <!-- Window -->
      
      <!-- Factory chimney -->
      <rect x="25" y="-40" width="10" height="20" fill="#E8F4FF" stroke="#0460E9" stroke-width="1.5" />
      
      <!-- Gear symbols -->
      <g transform="translate(-20, -30)" opacity="0.8">
        <circle cx="0" cy="0" r="7" fill="none" stroke="#0460E9" stroke-width="1.5" />
        <path d="M0,-7 L0,-4 M0,4 L0,7 M-7,0 L-4,0 M4,0 L7,0 M-5,-5 L-3,-3 M5,5 L3,3 M-5,5 L-3,3 M5,-5 L3,-3" 
              stroke="#0460E9" stroke-width="1.5" />
      </g>
      <g transform="translate(20, 0)" opacity="0.8">
        <circle cx="0" cy="0" r="9" fill="none" stroke="#0460E9" stroke-width="1.5" />
        <path d="M0,-9 L0,-5 M0,5 L0,9 M-9,0 L-5,0 M5,0 L9,0 M-6,-6 L-4,-4 M6,6 L4,4 M-6,6 L-4,4 M6,-6 L4,-4" 
              stroke="#0460E9" stroke-width="1.5" />
      </g>
    </g>
  </g>
  
  <!-- Healthcare Solutions Node -->
  <g transform="translate(620, 180)" filter="url(#drop-shadow)">
    <circle cx="0" cy="0" r="60" fill="#FFFFFF" stroke="#0099FF" stroke-width="2" />
    
    <!-- Healthcare Visualization -->
    <g transform="scale(0.8)">
      <!-- Healthcare Monitor -->
      <rect x="-35" y="-30" width="70" height="50" rx="3" fill="#E8F4FF" stroke="#0099FF" stroke-width="2" />
      <rect x="-30" y="-25" width="60" height="40" fill="#FFFFFF" stroke="#0099FF" stroke-width="1" />
      
      <!-- Heartbeat line -->
      <path d="M-25,-5 L-15,-5 L-10,15 L0,-25 L10,5 L15,-5 L25,-5" 
            fill="none" stroke="#0099FF" stroke-width="1.5" stroke-linejoin="round" />
      
      <!-- Medical devices -->
      <rect x="-25" y="25" width="50" height="10" rx="2" fill="#E8F4FF" stroke="#0099FF" stroke-width="1.5" />
      <circle cx="-15" cy="30" r="3" fill="#0099FF" />
      <circle cx="0" cy="30" r="3" fill="#0099FF" />
      <circle cx="15" cy="30" r="3" fill="#0099FF" />
      
      <!-- Medical cross symbol -->
      <g transform="translate(30, -20)">
        <path d="M0,-8 L0,8 M-8,0 L8,0" stroke="#0099FF" stroke-width="2.5" stroke-linecap="round" />
      </g>
    </g>
  </g>
  
  <!-- IoT/Smart Technology Node -->
  <g transform="translate(180, 420)" filter="url(#drop-shadow)">
    <circle cx="0" cy="0" r="60" fill="#FFFFFF" stroke="#001B2E" stroke-width="2" />
    
    <!-- IoT/Smart Tech Visualization -->
    <g transform="scale(0.75)">
      <!-- Connected devices representation -->
      <circle cx="-20" cy="-20" r="12" fill="#E8F4FF" stroke="#001B2E" stroke-width="1.5" />
      <circle cx="20" cy="-20" r="10" fill="#E8F4FF" stroke="#001B2E" stroke-width="1.5" />
      <circle cx="-25" cy="15" r="15" fill="#E8F4FF" stroke="#001B2E" stroke-width="1.5" />
      <circle cx="25" cy="15" r="13" fill="#E8F4FF" stroke="#001B2E" stroke-width="1.5" />
      
      <!-- Device icons -->
      <rect x="-27" y="-27" width="14" height="14" rx="2" fill="#FFFFFF" stroke="#001B2E" stroke-width="1" /> <!-- Tablet -->
      <rect x="15" y="-25" width="10" height="10" rx="1" fill="#FFFFFF" stroke="#001B2E" stroke-width="1" /> <!-- Phone -->
      <rect x="-35" y="10" width="20" height="10" rx="1" fill="#FFFFFF" stroke="#001B2E" stroke-width="1" /> <!-- Device -->
      <path d="M25,10 A5,5 0 1,1 25,20 A5,5 0 1,1 25,10" fill="#FFFFFF" stroke="#001B2E" stroke-width="1" /> <!-- Sensor -->
      
      <!-- Connection lines -->
      <path d="M-20,-20 L20,-20 M-25,15 L25,15 M-20,-20 L-25,15 M20,-20 L25,15 M-20,-20 L25,15 M20,-20 L-25,15" 
            stroke="#001B2E" stroke-width="1" stroke-dasharray="2,2" />
      
      <!-- Central hub -->
      <circle cx="0" cy="0" r="8" fill="#0460E9" />
      <path d="M-8,0 L8,0 M0,-8 L0,8" stroke="#FFFFFF" stroke-width="1.5" />
    </g>
  </g>
  
  <!-- Custom Development Solutions Node -->
  <g transform="translate(620, 420)" filter="url(#drop-shadow)">
    <circle cx="0" cy="0" r="60" fill="#FFFFFF" stroke="#0460E9" stroke-width="2" />
    
    <!-- Custom Development Visualization -->
    <g transform="scale(0.8)">
      <!-- Code/development representation -->
      <rect x="-35" y="-30" width="70" height="60" rx="3" fill="#E8F4FF" stroke="#0460E9" stroke-width="2" />
      <rect x="-30" y="-25" width="60" height="50" fill="#FFFFFF" stroke="#0460E9" stroke-width="1" />
      
      <!-- Code lines representation -->
      <path d="M-25,-15 L15,-15 M-25,-5 L5,-5 M-25,5 L10,5 M-25,15 L0,15" 
            stroke="#0460E9" stroke-width="1.5" opacity="0.7" />
      
      <!-- Gear and settings -->
      <g transform="translate(25, -15)">
        <circle cx="0" cy="0" r="10" fill="none" stroke="#0460E9" stroke-width="1.5" />
        <path d="M0,-10 L0,-6 M0,6 L0,10 M-10,0 L-6,0 M6,0 L10,0 M-7,-7 L-4,-4 M7,7 L4,4 M-7,7 L-4,4 M7,-7 L4,-4" 
              stroke="#0460E9" stroke-width="1.5" />
      </g>
    </g>
  </g>
  
  <!-- Connection lines between nodes -->
  <!-- Manufacturing to center -->
  <path d="M240,180 C300,220 320,260 370,280" 
        fill="none" stroke="#0460E9" stroke-width="2.5" stroke-opacity="0.6" marker-end="url(#arrowhead)" />
  
  <!-- Healthcare to center -->
  <path d="M560,180 C500,220 480,260 430,280" 
        fill="none" stroke="#0099FF" stroke-width="2.5" stroke-opacity="0.6" marker-end="url(#arrowhead)" />
  
  <!-- IoT to center -->
  <path d="M240,420 C300,380 320,340 370,320" 
        fill="none" stroke="#001B2E" stroke-width="2.5" stroke-opacity="0.6" marker-end="url(#arrowhead)" />
  
  <!-- Custom Development to center -->
  <path d="M560,420 C500,380 480,340 430,320" 
        fill="none" stroke="#0460E9" stroke-width="2.5" stroke-opacity="0.6" marker-end="url(#arrowhead)" />
  
  <!-- Curved connecting arcs between solution areas -->
  <path d="M200,240 C210,300 270,350 400,350 C530,350 590,300 600,240" 
        fill="none" stroke="#0460E9" stroke-width="2" stroke-opacity="0.4" stroke-dasharray="5,3" />
  
  <path d="M200,360 C210,300 270,250 400,250 C530,250 590,300 600,360" 
        fill="none" stroke="#0460E9" stroke-width="2" stroke-opacity="0.4" stroke-dasharray="5,3" />
  
  <!-- Connected data points showing integration -->
  <circle cx="300" cy="210" r="6" fill="#58CBF9" />
  <circle cx="500" cy="210" r="6" fill="#58CBF9" />
  <circle cx="300" cy="390" r="6" fill="#58CBF9" />
  <circle cx="500" cy="390" r="6" fill="#58CBF9" />
  
  <!-- Animated pulse circles around center -->
  <circle cx="400" cy="300" r="100" fill="none" stroke="#0460E9" stroke-width="1" opacity="0.5">
    <animate attributeName="r" values="95;110;95" dur="4s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0.5;0.1;0.5" dur="4s" repeatCount="indefinite" />
  </circle>
  
  <circle cx="400" cy="300" r="120" fill="none" stroke="#0460E9" stroke-width="1" opacity="0.3">
    <animate attributeName="r" values="115;130;115" dur="5s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0.3;0.05;0.3" dur="5s" repeatCount="indefinite" />
  </circle>
</svg>